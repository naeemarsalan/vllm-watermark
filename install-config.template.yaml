apiVersion: v1
baseDomain: REPLACE_WITH_BASE_DOMAIN
metadata:
  name: ocp-ai
publish: External
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  replicas: 3
  platform:
    aws:
      type: m6i.xlarge
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  replicas: 3
  platform:
    aws:
      type: m6i.xlarge
platform:
  aws:
    region: us-east-1
pullSecret: '__PULL_SECRET__'
sshKey: '__SSH_KEY__'

