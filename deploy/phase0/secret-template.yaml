# Template only -- copy to `secret.yaml` (gitignored, see .gitignore in
# this directory) and replace REPLACE_ME_WITH_HEX_SECRET before applying.
#
# Never commit a filled-in version of this file. Never print/log the real
# secret value (see AGENTS.md #3, CLAUDE.md task rules: "watermark keys
# come from env vars only. Never hardcode a production key ... Never
# print key material.").
#
# `WATERMARK_KEY` must be an even-length hex string (arbitrary length,
# decoded with `bytes.fromhex` -- see src/vllm_watermark/keys.py). A
# reasonable way to generate a demo/test key locally (NOT for production
# use -- run this, copy the output into your local secret.yaml, and
# never paste the output anywhere that gets logged/committed):
#
#   python3 -c "import secrets; print(secrets.token_hex(32))"
#
# For production key generation/rotation/storage, see the key-management
# design doc planned in docs/implementation.md Phase 5 (D4) -- this
# template is deliberately minimal (single key, no rotation) for the
# Phase 0/1 bare-pod spike only.
apiVersion: v1
kind: Secret
metadata:
  name: watermark-key
  namespace: watermark
type: Opaque
stringData:
  # Single-key form (src/vllm_watermark/keys.py `WATERMARK_KEY` +
  # `WATERMARK_KEY_ID`). Switch to a `WATERMARK_KEYS` key here instead
  # (format "keyid1:hexsecret1,keyid2:hexsecret2,...") if you need more
  # than one key_id available for `watermark_key_id` vllm_xargs testing.
  WATERMARK_KEY: "REPLACE_ME_WITH_HEX_SECRET"
  WATERMARK_KEY_ID: "default"
